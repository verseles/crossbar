name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    if: false # Temporarily disabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: "stable"
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libayatana-appindicator3-dev

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\Pub\Cache' || '~/.pub-cache' }}
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux GUI
        run: flutter build linux --release

      - name: Setup unified binaries
        run: |
          cd build/linux/x64/release/bundle
          mv crossbar crossbar-gui
          dart compile exe $GITHUB_WORKSPACE/bin/crossbar.dart -o crossbar

      - name: Compress artifact
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf $GITHUB_WORKSPACE/crossbar-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossbar-linux
          path: crossbar-linux-x64.tar.gz
          retention-days: 7

  build-macos:
    if: false # Temporarily disabled
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: "stable"
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\Pub\Cache' || '~/.pub-cache' }}
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS GUI
        run: flutter build macos --release

      - name: Setup unified binaries
        run: |
          cd build/macos/Build/Products/Release/crossbar.app/Contents/MacOS
          mv crossbar crossbar-gui
          dart compile exe $GITHUB_WORKSPACE/bin/crossbar.dart -o crossbar

      - name: Compress artifact
        run: |
          cd build/macos/Build/Products/Release
          tar -czvf $GITHUB_WORKSPACE/crossbar-macos-arm64.tar.gz crossbar.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossbar-macos
          path: crossbar-macos-arm64.tar.gz
          retention-days: 7

  build-windows:
    if: false # Temporarily disabled
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: "stable"
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\Pub\Cache' || '~/.pub-cache' }}
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows GUI
        run: flutter build windows --release

      - name: Setup unified binaries
        shell: pwsh
        run: |
          Rename-Item -Path "build/windows/x64/runner/Release/crossbar.exe" -NewName "crossbar-gui.exe"
          dart compile exe bin/crossbar.dart -o build/windows/x64/runner/Release/crossbar.exe

      - name: Compress artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "crossbar-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossbar-windows
          path: crossbar-windows-x64.zip
          retention-days: 7

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: "stable"
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\Pub\Cache' || '~/.pub-cache' }}
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Get dependencies
        run: flutter pub get

      - name: Download Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 secret not found. Skipping signing configuration."
          fi

      - name: Build APK (arm64 only)
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk crossbar-android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crossbar-android
          path: crossbar-android-arm64.apk
          retention-days: 7

  create-release:
    needs: [build-android] # linux/macos/windows temporarily disabled
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/crossbar-android/crossbar-android-arm64.apk
            # linux/macos/windows temporarily disabled
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
