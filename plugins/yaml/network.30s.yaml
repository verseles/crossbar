# Network Status - Declarative YAML
# Shows network connectivity

name: Network Status
interval: 30s

source:
  type: system
  command: network

output:
  icon: "🌐"
  text: "${response.status}"
  tooltip: "Local IP: ${response.localIp}"

menu:
  - title: "Status: ${response.status}"
  - title: "Local IP: ${response.localIp}"
  - separator
  - title: "Open Network Settings"
    action: exec:gnome-control-center network
  - title: "Refresh"
    action: refresh
